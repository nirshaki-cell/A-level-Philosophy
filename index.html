<style>
/* Layout: quiet centred header with four module tiles; each module page repeats the tile pattern for its spec sub-topics */
:root{
  --bg:#f1f6fb; --fg:#23262f; --muted:#5b6070; --card:#fbf6ec;
  --epi:#cfe3f7; --epi-ink:#1f4f7a;
  --mor:#d6efdf; --mor-ink:#245c3c;
  --god:#ece0f5; --god-ink:#5a2f78;
  --mind:#fbe3d6; --mind-ink:#8a3f1c;
  --font:"Avenir Light","Avenir","Avenir Next","Nunito Sans",sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:300;line-height:1.5;font-size:1.0625rem}
.wrap{max-width:1120px;margin:0 auto;padding-block:clamp(40px,8vw,88px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{text-align:center;display:grid;gap:12px;margin-bottom:clamp(32px,6vw,56px)}
header{position:relative}

.spec{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-weight:300;font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.15;text-wrap:balance}
.lede{margin:0 auto;max-width:60ch;color:var(--muted)}
.tuition{justify-self:center;margin-top:4px;background:var(--card);border:1px solid #dde4ee;border-radius:999px;font-size:.92rem;max-width:100%}
.tuition[open]{border-radius:14px}
.tuition summary{cursor:pointer;list-style:none;padding:8px 18px;font-weight:600;color:var(--fg)}
.tuition summary::-webkit-details-marker{display:none}
.tuition summary::after{content:" ▾";color:var(--muted)}
.tuition[open] summary::after{content:" ▴"}
.tuition summary:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:999px}
.tuition .body{padding:0 18px 14px;color:var(--muted)}
.tuition a{color:var(--epi-ink);font-weight:600;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.grid,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid,.grid.three{grid-template-columns:1fr}}
.epi{--tint:var(--epi);--ink:var(--epi-ink)} .mor{--tint:var(--mor);--ink:var(--mor-ink)}
.god{--tint:var(--god);--ink:var(--god-ink)} .mind{--tint:var(--mind);--ink:var(--mind-ink)}
.tile{display:flex;flex-direction:column;gap:10px;min-height:220px;padding:24px;border-radius:14px;
  text-decoration:none;color:var(--ink);background:var(--tint);transition:transform .2s ease}
.tile:hover{transform:translateY(-3px)}
a:focus-visible{outline:3px solid var(--ink,var(--fg));outline-offset:3px}
.tile .paper{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-variant-numeric:tabular-nums}
.tile h2{margin:0;font-weight:400;font-size:1.45rem;line-height:1.25}
.tile p{margin:0;font-size:.95rem}
.tile .go{margin-top:auto;font-size:.9rem;font-weight:600}
.tile.sm{min-height:170px;background:var(--card);border-top:6px solid var(--tint)}
.tile.sm h2{font-size:1.25rem;color:var(--fg)}
.tile.sm p{color:var(--muted)}
footer{margin-top:48px;text-align:center;font-size:.85rem;color:var(--muted)}
.back{display:inline-block;margin-bottom:24px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.band{background:var(--tint);color:var(--ink);border-radius:18px;padding:clamp(24px,5vw,44px);display:grid;gap:12px;margin-bottom:32px}
.band .spec{color:inherit}
.band .q{margin:0;max-width:62ch;font-size:1.1rem}
.tour{display:block;width:100%;height:600px;border:0;background:transparent}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.ptabs button{font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid #dde4ee;background:var(--card);color:#3b2a20;cursor:pointer}.ptabs button[aria-selected=true]{background:var(--tint);color:var(--ink);border-color:transparent}.ptabs button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.soon{background:var(--card);border-radius:14px;padding:28px;color:var(--muted)}
.podcast{background:var(--card);border:1px solid #dbe4ee;border-left:6px solid var(--tint);border-radius:14px;padding:18px 22px;margin-bottom:32px;display:grid;gap:10px;color:#3b2a20}
.podcast .kick{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#6e5a4c}
.podcast h2{margin:0;font-weight:400;font-size:1.2rem;color:#3b2a20}
.podcast p{margin:0;color:#6e5a4c;font-size:.95rem}
.podcast audio{width:100%}
.podcast .dl{justify-self:start;display:inline-block;background:color-mix(in srgb,var(--tint) 30%,#fff);color:#3b2a20;border:1px solid color-mix(in srgb,var(--tint) 70%,#fff);text-decoration:none;font-weight:600;font-size:.92rem;padding:9px 16px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.tuition summary{display:inline-flex;align-items:center;gap:8px}
.star{display:inline-block;width:14px;height:14px;color:#e8b64c;animation:twinkle 1.8s ease-in-out infinite}
.star svg{display:block;width:100%;height:100%;fill:currentColor}
.star.b{width:10px;height:10px;color:#c9a0e8;animation-delay:.6s}
.star.c{width:12px;height:12px;color:#8cc4ee;animation-delay:1.2s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.star{animation:none;opacity:1}}

h2.ph{display:flex;align-items:center;gap:8px}h2.ph .star{width:16px;height:16px;flex:none}
.prac{background:var(--card);border-radius:14px;padding:28px;display:grid;gap:12px;border-top:6px solid var(--tint)}.prac h2{margin:0;font-weight:400;font-size:1.3rem}.prac p{margin:0;color:var(--muted)}
.prac .open{justify-self:start;display:inline-block;margin-top:4px;padding:12px 20px;border-radius:999px;background:var(--tint);color:var(--ink);font-weight:600;text-decoration:none}.prac .open:hover{filter:brightness(.96)}.prac .small{font-size:.85rem}
/* Progress tracker */
.trk{background:var(--card);border-radius:14px;padding:clamp(16px,4vw,28px);border-top:6px solid var(--tint);display:grid;gap:12px}
.trk .tsum{margin:0;font-weight:600}.trk .small{margin:0;font-size:.85rem;color:var(--muted)}
.tbar{position:relative;height:10px;border-radius:999px;background:#fffdf8;border:1px solid #e6dccb;overflow:hidden}
.tbar span{position:absolute;left:0;top:0;bottom:0;border-radius:999px}#tbs{background:var(--tint)}#tbc{background:var(--ink);opacity:.55}
.tscroll{overflow-x:auto}
.trk table{width:100%;border-collapse:collapse;font-size:.95rem}
.trk th,.trk td{padding:10px 8px;border-bottom:1px solid #e6dccb;text-align:left;vertical-align:middle}
.trk thead th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.trk tbody th{font-weight:300}
.trk td{text-align:center;width:90px}.trk td:last-child{width:150px}
.trk tr.tg th{background:var(--tint);color:var(--ink);font-weight:600;border-radius:8px}
.trk input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);cursor:pointer}
.trk input[type=text]{width:100%;min-width:90px;font:inherit;padding:6px 8px;border:1px solid #e6dccb;border-radius:8px;background:#fffdf8;color:inherit}
@media (max-width:520px){.trk table{table-layout:fixed;font-size:.85rem}.trk th,.trk td{padding:8px 4px}.trk thead th:nth-child(1){width:auto}.trk thead th:nth-child(2),.trk thead th:nth-child(3){width:58px}.trk thead th:nth-child(4){width:64px}.trk td,.trk td:last-child{width:auto}.trk thead th{font-size:.58rem;letter-spacing:.04em}.trk input[type=text]{min-width:0;padding:5px 4px}.trk tbody th{overflow-wrap:anywhere}}
/* Cream panels with espresso text */
.panel,.card,.tabs button,.tile.sm,.soon,.prac,.trk,.tuition{--fg:#3b2a20;--muted:#6e5a4c;color:#3b2a20}
.tile.sm h2{color:#3b2a20}

.mascotlink{justify-self:center}.mascot{justify-self:center;width:min(220px,55vw);height:auto;display:block;margin-bottom:-4px}
.mascot .bub{transform-box:fill-box;transform-origin:center;animation:drift 4s ease-in-out infinite}
.mascot .b2{animation-delay:.5s}.mascot .b3{animation-delay:1s}
.mascot .q{animation:bob 4s ease-in-out infinite;animation-delay:1s;transform-box:fill-box;transform-origin:center}
.mascot .tail{transform-box:fill-box;transform-origin:10% 10%;animation:swish 5s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(3px,-7px) scale(1.08);opacity:1}}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-2px,-5px) rotate(-3deg)}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.mascot .bub,.mascot .q,.mascot .tail{animation:none}}

.catstage{position:relative;height:118px;overflow:hidden;margin:-8px 0 8px}
.catstage .floor{position:absolute;bottom:10px;left:0;right:0;height:2px;background:var(--tint);border-radius:2px}
.catstage .walker{position:absolute;bottom:14px;left:65%;width:130px;transform-origin:50% 100%;animation:cwalk 3.6s cubic-bezier(.25,.6,.35,1) both,csettle 1.4s ease-in-out 3.4s forwards}
.catstage .leg{transform-box:fill-box;transform-origin:50% 0;animation:cstep .45s ease-in-out 6 alternate,cstep2 .8s ease-in-out 2.7s 1 forwards}
.catstage .l2,.catstage .l3{animation-direction:alternate-reverse,normal}
.catstage .tl{transform-box:fill-box;transform-origin:0 100%;animation:csw 1s ease-in-out infinite alternate}
.catstage .head{transform-box:fill-box;transform-origin:50% 100%;animation:cnod 1.2s ease-in-out 3.3s forwards}
.catstage .sleeper{position:absolute;bottom:14px;left:calc(65% - 10px);width:150px;opacity:0;transform-origin:50% 100%;animation:ccurl 1.5s ease-out 3.9s forwards}
.catstage .body{transform-box:fill-box;transform-origin:center bottom;animation:cbreathe 3.2s ease-in-out 5.4s infinite}
.catstage .z{opacity:0;transform-box:fill-box;animation:czz 3.2s ease-in-out infinite}
.catstage .z1{animation-delay:5.6s}.catstage .z2{animation-delay:6.6s}.catstage .z3{animation-delay:7.6s}
@keyframes cwalk{from{transform:translateX(calc(35vw + 220px))}to{transform:translateX(0)}}
@keyframes cstep{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
@keyframes cstep2{to{transform:rotate(0)}}
@keyframes csw{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes cnod{to{transform:translateY(6px) rotate(-6deg)}}
@keyframes csettle{0%{transform:scale(1,1);opacity:1}55%{transform:scale(1.06,.82);opacity:1}100%{transform:scale(1.1,.7);opacity:0}}
@keyframes ccurl{0%{opacity:0;transform:scale(.92,.8)}60%{opacity:1;transform:scale(1.02,1.02)}100%{opacity:1;transform:scale(1,1)}}
@keyframes cbreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
@keyframes czz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-40px) scale(1.1)}}
@media (max-width:520px){.catstage .walker{left:50%}.catstage .sleeper{left:calc(50% - 10px)}}
@media (prefers-reduced-motion:reduce){.catstage .walker{display:none}.catstage .sleeper{animation:none;opacity:1}.catstage .body,.catstage .z{animation:none}.catstage .z{opacity:1}}


.band{position:relative;overflow:hidden}
.band.hascat{padding-right:clamp(24px,34%,360px);min-height:150px}
.catlink{display:block;cursor:pointer;border-radius:12px;text-decoration:none}.catlink:focus-visible{outline:3px solid #4E8A72;outline-offset:2px}.catlink svg{transition:filter .2s}.catlink:hover svg{filter:brightness(1.06)}
.band .catstage{position:absolute;right:8px;bottom:4px;width:320px;height:130px;margin:0}
.band .catstage .floor{display:none}
.band .catstage .walker{left:40%}.band .catstage .sleeper{left:calc(40% - 10px)}
.band.hascat>:not(.catstage){position:relative;z-index:1}
@media (max-width:700px){.band.hascat{padding-right:clamp(24px,5vw,44px);padding-bottom:140px}.band .catstage{left:0;right:0;width:100%}.band .catstage .walker{left:50%}.band .catstage .sleeper{left:calc(50% - 10px)}}


.peek{opacity:0;animation:peek 9s steps(1,end) infinite}.shut{animation:shut 9s steps(1,end) infinite}
.mascot .peek,.mascot .shut{animation-duration:7s;animation-delay:1.5s}
.hascat .peek,.hascat .shut{animation-delay:calc(3s + var(--bd,0s))}
.still .peek{animation:none!important;opacity:0}.still .shut{animation:none!important;opacity:1}
@keyframes peek{0%,88%{opacity:0}88.5%,92%{opacity:1}92.5%,100%{opacity:0}}
@keyframes shut{0%,88%{opacity:1}88.5%,92%{opacity:0}92.5%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.peek{animation:none!important;opacity:0}.shut{animation:none!important;opacity:1}}
</style>

  if(f&&e.source===f.contentWindow&&e.data&&e.data.tourHeight){fitTour(f,e.data.tourHeight);
    if(e.data.jump)f.scrollIntoView();}});

var DL=null;(async function(){try{DL=await claude.use("downloads");}catch(e){}})();
window.addEventListener("message",async function(e){var f=document.getElementById("tour");
  if(!f||e.source!==f.contentWindow||!e.data||!e.data.dlFile)return;
  var p=String(e.data.dlFile);if(!/^downloads\/[\w.-]+\.(pdf|pptx|docx)$/.test(p))return;
  try{if(!DL)DL=await claude.use("downloads");if(!DL)throw {code:"unavailable"};
    var b=await (await fetch(p)).blob();await DL.save({filename:p.split("/").pop(),data:b});
  }catch(err){if(err&&err.code==="declined")return;window.open(p,"_blank");}
});
function ptab(k){['w','p'].forEach(function(x){var on=x===k;document.getElementById('tb-'+x).setAttribute('aria-selected',on);document.getElementById('pn-'+x).hidden=!on;});}
